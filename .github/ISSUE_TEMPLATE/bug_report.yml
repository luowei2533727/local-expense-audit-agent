name: 缺陷报告
description: 报告可复现的功能、Agent或评测问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿上传真实票据、账号、Token、数据库或包含私人信息的日志。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 说明实际行为和预期行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动...
        2. 调用...
        3. 观察到...
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 模型与版本
      placeholder: qwen3:4b-instruct / Ollama version
  - type: textarea
    id: validation
    attributes:
      label: 已完成的验证
      description: 请提供脱敏日志、测试或最小复现，不要包含个人信息。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认内容不包含真实票据、账号、密钥或其他私人信息。
          required: true
